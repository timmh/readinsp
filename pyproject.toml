[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readinsp"
version = "0.1.0"
description = "Read Insta360 .insp still images into NumPy arrays"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
